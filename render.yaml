services:
  - type: web
    name: hbl
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn hbl_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: ENABLE_HSTS
        value: "True"
      - key: NOWPAYMENTS_FEE_PAID_BY_USER
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: hbl-db
          property: connectionString

databases:
  # El plan free sirve para pruebas. Cambia a un plan persistente antes de producción.
  - name: hbl-db
    plan: free
