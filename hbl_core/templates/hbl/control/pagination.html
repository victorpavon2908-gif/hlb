{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination"><span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a class="secondary-btn inline" href="?page={{ page_obj.previous_page_number }}{% if q %}&q={{ q }}{% endif %}">Anterior</a>{% endif %}{% if page_obj.has_next %}<a class="secondary-btn inline" href="?page={{ page_obj.next_page_number }}{% if q %}&q={{ q }}{% endif %}">Siguiente</a>{% endif %}</div></nav>{% endif %}
